name: Deploy Templates
description: Deploy to multiple different environments using templates.
author: https://github.com/cultureamp
requirements: []
configuration:
  properties:
    step-template:
      type: string
    built-in-template:
      type: string
      enum:
        - harness-deploy
      description: "Use a step template shipped with this plugin instead of authoring your own. Mutually exclusive with step-template."
    step-var-names:
      type: array
    auto-selections:
      type: array
    selector-template:
      type: string
    auto-deploy-to-production:
      type: boolean
      default: false
    group-label:
      type: string
  additionalProperties: false
  oneOf:
    - required:
        - step-template
    - required:
        - built-in-template
  anyOf:
    - required:
        - auto-selections
    - required:
        - selector-template
    - required:
        - auto-deploy-to-production
